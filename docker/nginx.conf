server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # ---- Compression --------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/manifest+xml application/xml
                      image/svg+xml font/woff font/woff2;

    # ---- Security headers ---------------------------------------------------
    # nginx only inherits these into a location block when that block declares
    # no add_header of its own. The location blocks below therefore use the
    # `expires` directive for caching, which leaves these headers intact.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' https://*.firebasedatabase.app; script-src-elem 'self' https://*.firebasedatabase.app; connect-src 'self' https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://*.firebasedatabase.app wss://*.firebasedatabase.app; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # ---- Health check -------------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- Hashed build assets ------------------------------------------------
    # Filenames contain a content hash, so they can be cached for a year.
    location /static/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # ---- Application shell --------------------------------------------------
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # Never serve dotfiles such as .env or .git.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
