services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: react-burger-builder:latest
    container_name: react-burger-builder
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional local backend. Requires the Firebase CLI and a Java runtime:
  #   npx firebase-tools emulators:start --only auth,database
  # The project id must match the one in .env.local, otherwise the security
  # rules bind to a different namespace and are not applied.
  # Then run the app with:
  #   REACT_APP_FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099 \
  #   REACT_APP_FIREBASE_DATABASE_EMULATOR_HOST=127.0.0.1:9000 \
  #   npm start
  # firebase:
  #   image: node:18-alpine
  #   working_dir: /workspace
  #   volumes:
  #     - .:/workspace
  #   command: npx firebase-tools emulators:start --only auth,database --project burger-builder-951c6
  #   ports:
  #     - "9099:9099"   # authentication emulator
  #     - "9000:9000"   # database emulator
